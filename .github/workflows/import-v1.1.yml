name: One-time exact import from Concord-1.1

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Concord-1.2
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone frozen Concord-1.1 snapshot read-only
        run: |
          git clone --no-tags https://github.com/ACBlainey/Concord-1.1.git /tmp/concord-v1.1
          git -C /tmp/concord-v1.1 checkout e68303c6160c8bced4f1767b1fda9bf9e23aab85
          test "$(git -C /tmp/concord-v1.1 rev-parse HEAD)" = "e68303c6160c8bced4f1767b1fda9bf9e23aab85"

      - name: Replace V1.2 working tree with exact V1.1 files
        run: |
          rsync -a --delete --exclude='.git/' /tmp/concord-v1.1/ ./
          git status --short

      - name: Commit and push exact snapshot to V1.2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Copy exact Concord V1.1 snapshot into V1.2"
          git push origin HEAD:main
